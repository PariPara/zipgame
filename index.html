<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zip Game - 10 Levels</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: #1e293b;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
      color: #38bdf8;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      margin: 15px 0;
      padding: 10px;
      background: #0f172a;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
    }

    .grid {
      display: grid;
      gap: 10px;
      margin: 20px 0;
      justify-content: center;
    }

    .cell {
      width: 60px;
      height: 60px;
      background: #334155;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
    }

    .cell:hover {
      background: #475569;
    }

    .cell.visited {
      background: #38bdf8;
      color: #0f172a;
      transform: scale(0.95);
    }

    .cell.current {
      background: #f59e0b;
      color: #0f172a;
      box-shadow: 0 0 12px #f59e0b;
    }

    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 15px;
    }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-reset {
      background: #ef4444;
      color: white;
    }

    .btn-reset:hover {
      background: #dc2626;
    }

    .btn-share {
      background: #10b981;
      color: white;
    }

    .btn-share:hover {
      background: #059669;
    }

    .instructions {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 15px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      background: #38bdf8;
      color: #0f172a;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: bold;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>ZIP GAME</h1>
    <p style="color:#94a3b8">Connect numbers 1 to N in sequence!</p>

    <div class="stats">
      <span>Level: <span id="level-display">1</span>/10</span>
      <span>Time: <span id="timer-display">0.0</span>s</span>
    </div>

    <div id="grid" class="grid"></div>

    <div class="controls">
      <button class="btn-reset" onclick="resetLevel()">Reset Level</button>
      <button class="btn-share" onclick="shareGame()">Share Link</button>
    </div>

    <p class="instructions">Click on tile 1, then click neighboring adjacent tiles in order (1 -> 2 -> 3...) to solve the grid.</p>
  </div>

  <div id="toast" class="toast">Link copied to clipboard!</div>

  <script>
    // 10 Level configurations (grid sizes & targets)
    const levels = [
      { size: 2, target: 4 },
      { size: 3, target: 5 },
      { size: 3, target: 7 },
      { size: 3, target: 9 },
      { size: 4, target: 8 },
      { size: 4, target: 10 },
      { size: 4, target: 12 },
      { size: 4, target: 16 },
      { size: 5, target: 15 },
      { size: 5, target: 20 }
    ];

    let currentLevel = 0;
    let gridState = [];
    let path = [];
    let timer = null;
    let seconds = 0;
    let timerRunning = false;

    function startTimer() {
      if (timerRunning) return;
      timerRunning = true;
      seconds = 0;
      document.getElementById('timer-display').innerText = '0.0';
      timer = setInterval(() => {
        seconds += 0.1;
        document.getElementById('timer-display').innerText = seconds.toFixed(1);
      }, 100);
    }

    function stopTimer() {
      clearInterval(timer);
      timerRunning = false;
    }

    function initLevel() {
      stopTimer();
      document.getElementById('timer-display').innerText = '0.0';
      document.getElementById('level-display').innerText = currentLevel + 1;
      
      const level = levels[currentLevel];
      const gridElement = document.getElementById('grid');
      gridElement.style.gridTemplateColumns = `repeat(${level.size}, 60px)`;
      gridElement.innerHTML = '';
      path = [];

      gridState = Array(level.size * level.size).fill(null);

      for (let i = 0; i < level.size * level.size; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.index = i;
        cell.addEventListener('click', () => handleCellClick(i));
        gridElement.appendChild(cell);
      }
    }

    function handleCellClick(index) {
      const level = levels[currentLevel];

      if (path.length === 0) {
        // First click starts timer and path at 1
        startTimer();
        path.push(index);
        updateGridUI();
        return;
      }

      const lastIndex = path[path.length - 1];
      if (isAdjacent(lastIndex, index, level.size) && !path.includes(index)) {
        path.push(index);
        updateGridUI();

        // Check level win condition
        if (path.length === level.target) {
          stopTimer();
          setTimeout(() => {
            alert(`Level ${currentLevel + 1} cleared in ${seconds.toFixed(1)} seconds!`);
            if (currentLevel < levels.length - 1) {
              currentLevel++;
              initLevel();
            } else {
              alert('🎉 Congratulations! You completed all 10 levels!');
              currentLevel = 0;
              initLevel();
            }
          }, 150);
        }
      }
    }

    function isAdjacent(idx1, idx2, size) {
      const r1 = Math.floor(idx1 / size), c1 = idx1 % size;
      const r2 = Math.floor(idx2 / size), c2 = idx2 % size;
      return Math.abs(r1 - r2) <= 1 && Math.abs(c1 - c2) <= 1 && !(r1 === r2 && c1 === c2);
    }

    function updateGridUI() {
      const cells = document.querySelectorAll('.cell');
      cells.forEach((cell, idx) => {
        cell.className = 'cell';
        cell.innerText = '';

        const pathIndex = path.indexOf(idx);
        if (pathIndex !== -1) {
          cell.classList.add('visited');
          cell.innerText = pathIndex + 1;
          if (pathIndex === path.length - 1) {
            cell.classList.add('current');
          }
        }
      });
    }

    function resetLevel() {
      stopTimer();
      path = [];
      document.getElementById('timer-display').innerText = '0.0';
      updateGridUI();
    }

    function shareGame() {
      const url = window.location.href;
      if (navigator.share) {
        navigator.share({
          title: 'Zip Game',
          text: `Try out this Zip Game! I am on Level ${currentLevel + 1}!`,
          url: url
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(url);
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
      }
    }

    // Initialize first level
    initLevel();
  </script>
</body>
</html>
